name: Build PackZeit APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: APK kompilieren
    runs-on: ubuntu-latest

    steps:
      - name: Code aus Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: App-Struktur vorbereiten
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp index.html android/app/src/main/assets/public/index.html

          if [ -f icon.png ]; then
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Android Manifest erstellen
        run: |
          mkdir -p android/app/src/main
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.bjoernvoss.packzeit">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="PackZeit"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Gradle Build ausführen
        run: |
          cd android
          mkdir -p app
          cat << 'EOF' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.bjoernvoss.packzeit"
                  minSdkVersion 22
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          gradle wrapper
          ./gradlew assembleDebug

      - name: Fertige APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PackZeit-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
